<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telemetry Console</title>
<style>
  :root { --bg:#ffffff; --fg:#111827; --card:#f3f4f6; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --fg:#e5e7eb; --card:#172033; --accent:#60a5fa; } }
  [hidden] { display:none !important; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { padding:24px; max-width:720px; }
  main.compact { padding:6px; font-size:12px; }
  .card { background:var(--card); padding:16px; margin:12px 0; border-radius:6px; }
  .banner { padding:10px 14px; border-radius:6px; }
  .banner--degraded { background:#fde68a; color:#78350f; }
  .skeleton { height:48px; border-radius:4px; background:linear-gradient(90deg,#9ca3af55,#9ca3af99,#9ca3af55); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .big { font-size:40px; font-weight:700; }
  svg { width:100%; height:80px; color:var(--accent); }
  canvas { border:1px solid #9ca3af; width:600px; height:300px; max-width:100%; }
  #node-popover { margin-top:8px; padding:8px 12px; border:1px solid var(--accent); border-radius:6px; }
</style>
</head>
<body>
<main id="dashboard" data-testid="dashboard">
  <h1>Telemetry Console</h1>
  <div class="banner" data-testid="status-banner" role="alert" hidden></div>

  <section class="card" data-testid="telemetry-widget">
    <h2>Live telemetry</h2>
    <div class="skeleton" data-testid="telemetry-skeleton"></div>
    <div class="big" data-testid="telemetry-value" hidden></div>
    <svg viewBox="0 0 190 100" preserveAspectRatio="none"><polyline data-testid="telemetry-line" points="" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </section>

  <section class="card">
    <h2>Audio stream</h2>
    <audio src="/media/tone.wav" loop preload="none"></audio>
    <button data-testid="audio-play" data-state="paused">Play</button>
  </section>

  <section class="card">
    <h2>Network topology</h2>
    <canvas width="600" height="300" data-testid="network-canvas"></canvas>
    <div>
      <button data-testid="map-clear">Clear selection</button>
    </div>
    <div id="node-popover" data-testid="node-popover" hidden>
      <strong data-testid="node-title"></strong> &mdash; <span data-testid="node-status"></span>
    </div>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <label><input type="checkbox" id="toggle-compact"> Compact mode</label>
  </section>
</main>

<script>
const qs = new URLSearchParams(location.search);
const $ = (id) => document.querySelector('[data-testid="' + id + '"]');

// ---- Telemetry (SSE) ----
const values = [];
function renderTelemetry(d) {
  $('telemetry-widget').dataset.seq = d.seq;
  $('telemetry-skeleton').hidden = true;
  const v = $('telemetry-value'); v.hidden = false; v.textContent = d.value;
  values.push(d.value); if (values.length > 20) values.shift();
  $('telemetry-line').setAttribute('points', values.map((y, i) => (i * 10) + ',' + (100 - y)).join(' '));
}
if (qs.has('freeze')) { // deterministic data for visual regression
  [40, 55, 70, 60, 45, 65, 80, 50, 35, 60].forEach((v, i) => renderTelemetry({ seq: i + 1, value: v }));
} else {
  const es = new EventSource('/api/v1/telemetry/stream');
  es.onmessage = (e) => renderTelemetry(JSON.parse(e.data));
}


 // ---- System status polling ----
async function pollStatus() {
  const b = $('status-banner');
  try {
    const r = await fetch('/api/v1/system-status');
    if (!r.ok) throw new Error('status ' + r.status);
    b.hidden = true;
    b.classList.remove('banner--degraded');
  } catch (err) {
    b.textContent = 'Reconnecting...';
    b.classList.add('banner--degraded');
    b.hidden = false;
  }
}
pollStatus();
setInterval(pollStatus, 2000);



// ---- Audio ----
const audio = document.querySelector('audio'); const playBtn = $('audio-play');
playBtn.addEventListener('click', () => (audio.paused ? audio.play() : audio.pause()));
audio.addEventListener('playing', () => { playBtn.dataset.state = 'playing'; playBtn.textContent = 'Pause'; });
audio.addEventListener('pause', () => { playBtn.dataset.state = 'paused'; playBtn.textContent = 'Play'; });

// ---- Canvas topology map ----
const NODES = [
  { id: 'core-router', x: 0.5, y: 0.2, status: 'healthy' },
  { id: 'edge-1', x: 0.2, y: 0.7, status: 'healthy' },
  { id: 'edge-2', x: 0.8, y: 0.7, status: 'degraded' },
];
const cv = document.querySelector('canvas'); const ctx = cv.getContext('2d');
function draw(sel) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#888';
  NODES.slice(1).forEach((n) => { ctx.beginPath(); ctx.moveTo(NODES[0].x * cv.width, NODES[0].y * cv.height); ctx.lineTo(n.x * cv.width, n.y * cv.height); ctx.stroke(); });
  NODES.forEach((n) => { ctx.beginPath(); ctx.arc(n.x * cv.width, n.y * cv.height, 14, 0, Math.PI * 2); ctx.fillStyle = n.id === sel ? '#f59e0b' : '#3b82f6'; ctx.fill(); });
}
draw();
cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect();
  const x = ((e.clientX - r.left) * cv.width) / r.width, y = ((e.clientY - r.top) * cv.height) / r.height;
  const hit = NODES.find((n) => Math.hypot(n.x * cv.width - x, n.y * cv.height - y) <= 14);
  if (!hit) return;
  draw(hit.id);
  $('node-title').textContent = hit.id; $('node-status').textContent = hit.status; $('node-popover').hidden = false;
});
$('map-clear').addEventListener('click', () => { draw(); $('node-popover').hidden = true; });

// ---- Cross-tab settings via SharedWorker ----
const sw = new SharedWorker('/worker.js');
const toggle = document.getElementById('toggle-compact');
sw.port.onmessage = (e) => {
  if (e.data.type !== 'state') return;
  toggle.checked = e.data.state.compact;
  document.getElementById('dashboard').classList.toggle('compact', e.data.state.compact);
};
sw.port.postMessage({ type: 'join', session: qs.get('session') || 'default' });
toggle.addEventListener('change', () => sw.port.postMessage({ type: 'set', patch: { compact: toggle.checked } }));
</script>
</body>
</html>
