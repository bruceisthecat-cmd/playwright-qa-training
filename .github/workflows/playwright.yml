
name: Playwright QA Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run Playwright functional regression tests
        run: npx playwright test tests/login.spec.ts tests/network.spec.ts tests/media.spec.ts tests/multitab.spec.ts --project=chromium

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
    
     